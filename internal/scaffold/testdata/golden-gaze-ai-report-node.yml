# Scaffolded by gaze init --ci (gaze v2.4.0).
#
# This file is user-owned: rerunning `gaze init --ci` will not overwrite
# it (use --force to regenerate it).
#
# CI integration guide:
# https://github.com/unbound-force/gaze/blob/main/docs/guides/ci-integration.md
#
# The `on:` triggers below assume `main` is the default branch. If your
# repository's default branch has another name, adjust the `branches:`
# filters under `on:`.
#
# The `uses:` pin below targets a gaze release tag. For immutable pinning,
# replace the tag with the tag's 40-character commit SHA.
name: Gaze AI Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: every job in this workflow is capped at
# read-only repository access.
permissions:
  contents: read

# Superseded PR runs cancel while main-branch runs queue: AI-report runs
# spend LLM budget, so a superseded run should not be allowed to finish.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm test -- --coverage

      # Stage the coverage directory inside a staging root before
      # upload: actions/upload-artifact strips the least-common-ancestor
      # directory of the upload path, so uploading `coverage` directly
      # would put coverage-final.json at the artifact root. Staging
      # preserves the coverage/ prefix so the analyzer finds its files
      # at the conventional workspace path after download.
      - name: Stage coverage for upload
        run: mkdir -p .gaze-artifact && cp -r coverage .gaze-artifact/

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-out
          path: .gaze-artifact

  gaze-ai-report:
    needs: test
    # Explicit least-privilege grant at the reusable-workflow call site:
    # the called workflow inherits the caller job's permissions and can
    # only downgrade them, never elevate them.
    permissions:
      contents: read
    uses: unbound-force/gaze/.github/workflows/reusable_gaze_ai_report.yml@v2.4.0
    with:
      coverage-artifact: coverage-out
      gaze-version: v2.4.0
      analyzer: gaze-analyzer-typescript
      packages: ./src/...
      node-version: 24
      # The report job runs on its own runner and does NOT inherit the
      # test job's installed packages: the analyzer binary must be
      # installed there before `gaze report` can spawn it. This default
      # assumes the analyzer is this repository's own root package —
      # adjust it to wherever your analyzer lives (a workspace package,
      # a published npm package, etc.).
      setup: npm ci && npm run build && npm link
      # Report-only by default: the threshold inputs below are commented
      # out, so the workflow exits 0 until a human chooses values. To
      # enable one: run `gaze report ./src/... --analyzer=gaze-analyzer-typescript --format=json`, read the summary
      # metrics, pick a permissive initial value, replace <N> with a real
      # number, and uncomment the line. The <N> placeholder fails the
      # reusable workflow's number-typed input check, so uncommenting
      # without choosing a value is not possible.
      # max-crapload: <N>  # TODO: fail when the CRAPload exceeds this value
      # max-gaze-crapload: <N>  # TODO: fail when the GazeCRAPload exceeds this value
      # min-contract-coverage: <N>  # TODO: fail when average contract coverage falls below this percentage
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
