# Reusable Gaze AI Report
# =======================
# Provider-agnostic workflow that runs `gaze report --ai=opencode`
# against the calling repository and enforces CRAP thresholds.
#
# Contract:
# - The caller uploads a coverage artifact in a prior job and
#   passes its name via `coverage-artifact`.
# - The entire opencode configuration — provider, model,
#   permissions, and literal API key — arrives via the
#   `opencode-config` secret (strict JSON) and is exported
#   verbatim as OPENCODE_CONFIG_CONTENT. The consumer controls
#   the whole configuration; this workflow dictates no provider
#   specifics. Permission denials (edit/bash/webfetch/websearch)
#   are recommended since the config carries key material.
# - When `opencode-config` is unavailable (e.g. fork PRs), the
#   opencode install and report steps are skipped with a notice so
#   the wiring still validates without secrets.
# - Concurrency and cancellation policy is caller-owned: callers
#   SHOULD define a concurrency group (CI-012).
# - gaze is installed from the `gaze-version` release tag. The gaze
#   repository itself sets `build-from-source: true` to dogfood the
#   commit under test; any other module fails that path fast.
# - For external analyzers (TypeScript, Python, etc.), the caller
#   passes `analyzer` and `packages` so the report runs with
#   `gaze report <packages> --analyzer=<analyzer>`; `coverprofile`
#   is omitted in that mode and the analyzer reads coverage data
#   from the artifact's contents directly. Optional `setup`,
#   `node-version`, and `python-version` inputs handle toolchain
#   and analyzer installation.
name: Reusable Gaze AI Report

on:
  workflow_call:
    inputs:
      model:
        description: "Optional model override; when unset, opencode uses the config's top-level model."
        required: false
        type: string
      coverage-artifact:
        description: "Artifact name in the calling run that contains the coverprofile."
        required: true
        type: string
      coverprofile:
        description: "Path to the coverprofile after artifact extraction, relative to the workspace root; must match the artifact's internal layout."
        required: false
        default: "coverage.out"
        type: string
      max-crapload:
        description: "Fail when the CRAPload exceeds this value."
        required: false
        type: number
      max-gaze-crapload:
        description: "Fail when the GazeCRAPload exceeds this value."
        required: false
        type: number
      min-contract-coverage:
        description: "Fail when average contract coverage falls below this percentage."
        required: false
        type: number
      opencode-version:
        description: "opencode-ai npm version to install."
        required: false
        default: "1.19.0"
        type: string
      gaze-version:
        description: "gaze release tag to install. Ignored when build-from-source is true."
        required: false
        # Keep equal to the release tag that ships this file, so callers
        # pinned to @vX.Y.Z run that same release by default. Enforced at
        # release time by .github/scripts/validate-ai-report-default.sh.
        default: "v2.6.0"
        type: string
      build-from-source:
        description: "Build gaze from the checked-out tree instead of installing gaze-version. For the gaze repository's own dogfood job only; fails on any other module."
        required: false
        default: false
        type: boolean
      go-version:
        description: "Go toolchain version for setup-go."
        required: false
        default: "1.25"
        type: string
      analyzer:
        description: "External analyzer binary to use (e.g. gaze-analyzer-typescript). When empty, Go-native analysis is used."
        required: false
        default: ""
        type: string
      language:
        description: "Language override for the report (e.g. typescript, python). Passed as --language when non-empty; depends on gaze report --language support."
        required: false
        default: ""
        type: string
      packages:
        description: "Package pattern to analyze (e.g. ./src/... to exclude scaffolded .opencode/ code). Replaces the hard-coded ./... positional argument."
        required: false
        default: "./..."
        type: string
      setup:
        description: "Optional shell snippet run before gaze report to install/link the analyzer (e.g. npm ci && npm run build && npm link)."
        required: false
        default: ""
        type: string
      node-version:
        description: "Node.js version for setup-node (e.g. 20). When empty, the step is skipped."
        required: false
        default: ""
        type: string
      python-version:
        description: "Python version for setup-python (e.g. 3.12). When empty, the step is skipped."
        required: false
        default: ""
        type: string
    secrets:
      opencode-config:
        description: "Full strict-JSON opencode config (provider, model, permissions, literal API key); exported verbatim as OPENCODE_CONFIG_CONTENT."
        required: false

permissions:
  contents: read

jobs:
  gaze-ai-report:
    name: Gaze AI Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAS_OPENCODE_CONFIG: ${{ secrets.opencode-config != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The job never pushes or commits; do not leave the job token
          # persisted in .git/config for the AI subprocess to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download coverage
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .

      - name: Install gaze (release)
        if: ${{ !inputs.build-from-source }}
        env:
          GAZE_RELEASE: ${{ inputs.gaze-version }}
        run: |
          go install github.com/unbound-force/gaze/v2/cmd/gaze@"$GAZE_RELEASE"
          gaze --version

      - name: Install gaze (source)
        if: ${{ inputs.build-from-source }}
        env:
          EXPECTED_MODULE: github.com/unbound-force/gaze/v2
        run: |
          MODULE="$(go list -m 2>/dev/null || true)"
          if [ "$MODULE" != "$EXPECTED_MODULE" ]; then
            echo "::error::build-from-source requires the checked-out module to be $EXPECTED_MODULE (found '${MODULE:-none}'); set gaze-version instead"
            exit 1
          fi
          # Stamp the same symbols GoReleaser does, so `gaze --version`
          # and the published report header identify the tree that
          # produced the report (GITHUB_SHA is the checked-out commit).
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          go install -ldflags "-X main.version=dev-${GITHUB_SHA:0:12} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}" ./cmd/gaze
          gaze --version

      - name: Install OpenCode
        if: env.HAS_OPENCODE_CONFIG == 'true'
        env:
          OPENCODE_RELEASE: ${{ inputs.opencode-version }}
        run: npm install -g opencode-ai@"$OPENCODE_RELEASE"

      - name: Setup analyzer
        if: env.HAS_OPENCODE_CONFIG == 'true' && inputs.setup != ''
        env:
          # Env indirection per GitHub's script-injection guidance: the
          # caller's snippet is data at the assignment site and only
          # becomes code when eval parses it. The input is repo-owner
          # controlled (the caller workflow is checked into the calling
          # repository) and is by design an arbitrary setup snippet —
          # the same trust boundary as the caller's own workflow steps.
          ANALYZER_SETUP: ${{ inputs.setup }}
        run: eval "$ANALYZER_SETUP"
        shell: bash

      - name: Run gaze AI report
        if: env.HAS_OPENCODE_CONFIG == 'true'
        env:
          OPENCODE_CONFIG_CONTENT: ${{ secrets.opencode-config }}
          GAZE_MODEL: ${{ inputs.model }}
          ANALYZER: ${{ inputs.analyzer }}
          LANGUAGE: ${{ inputs.language }}
          PACKAGES: ${{ inputs.packages }}
          COVERPROFILE: ${{ inputs.coverprofile }}
          MAX_CRAPLOAD: ${{ inputs.max-crapload }}
          MAX_GAZE_CRAPLOAD: ${{ inputs.max-gaze-crapload }}
          MIN_CONTRACT_COVERAGE: ${{ inputs.min-contract-coverage }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          MODEL_ARG=""
          if [ -n "$GAZE_MODEL" ]; then
            MODEL_ARG="--model=$GAZE_MODEL"
          fi
          ANALYZER_ARG=""
          if [ -n "$ANALYZER" ]; then
            ANALYZER_ARG="--analyzer=$ANALYZER"
          fi
          LANGUAGE_ARG=""
          if [ -n "$LANGUAGE" ]; then
            LANGUAGE_ARG="--language=$LANGUAGE"
          fi
          # Go mode (no analyzer) uses --coverprofile; analyzer mode
          # omits it — the analyzer reads coverage data from the
          # artifact's contents directly.
          COVERPROFILE_ARG=""
          if [ -z "$ANALYZER" ] && [ -n "$COVERPROFILE" ]; then
            COVERPROFILE_ARG="--coverprofile=$COVERPROFILE"
          fi
          # Threshold inputs are optional: unset `type: number` inputs
          # render as empty strings in env, so the guards below omit the
          # flags and the report runs in report-only mode. An explicit 0
          # is NOT treated as unset — it passes through as a live
          # threshold (gaze enforces thresholds set to 0).
          THRESHOLDS=""
          if [ -n "$MAX_CRAPLOAD" ]; then
            THRESHOLDS="$THRESHOLDS --max-crapload=$MAX_CRAPLOAD"
          fi
          if [ -n "$MAX_GAZE_CRAPLOAD" ]; then
            THRESHOLDS="$THRESHOLDS --max-gaze-crapload=$MAX_GAZE_CRAPLOAD"
          fi
          if [ -n "$MIN_CONTRACT_COVERAGE" ]; then
            THRESHOLDS="$THRESHOLDS --min-contract-coverage=$MIN_CONTRACT_COVERAGE"
          fi
          # $PACKAGES expands unquoted on purpose: the input accepts
          # space-separated patterns, and the value comes from the
          # caller's checked-in workflow (repo-owner trusted). The
          # assembled *_ARG and $THRESHOLDS variables are each empty
          # or a single argument, so their unquoted expansion only
          # ever adds the flags assembled above.
          gaze report $PACKAGES \
            --ai=opencode \
            $MODEL_ARG \
            $ANALYZER_ARG \
            $LANGUAGE_ARG \
            $COVERPROFILE_ARG \
            $THRESHOLDS

      - name: Report skipped
        if: env.HAS_OPENCODE_CONFIG != 'true'
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          COVERPROFILE: ${{ inputs.coverprofile }}
          ARTIFACT_NAME: ${{ inputs.coverage-artifact }}
          ANALYZER: ${{ inputs.analyzer }}
          DOWNLOAD_CONCLUSION: ${{ steps.download.conclusion }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "Skipping the gaze AI report: no opencode config secret available (secrets are unavailable on fork PRs)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::opencode-config secret missing on a non-fork run — check the secret name and scope."
            echo "Skipping the gaze AI report: no opencode config secret available (the opencode-config secret is unset; check its name and scope)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Validate the artifact handoff contract even when the report
          # is skipped: every run that reaches this job asserts the
          # coverage data arrived (name, content, and path) instead of
          # only the artifact name. Both modes assert the download
          # step's conclusion explicitly — actions/download-artifact
          # fails when the named artifact does not exist in the calling
          # run, and actions/upload-artifact cannot create an empty
          # artifact, so a successful download means the artifact
          # arrived holding at least one file. In Go mode (no analyzer)
          # the check goes further and requires the coverprofile file
          # inside the downloaded artifact; in analyzer mode the
          # artifact holds whatever that analyzer reads, so its shape
          # is the analyzer's own contract and the download is the
          # arrival check.
          test "$DOWNLOAD_CONCLUSION" = "success" || {
            echo "::error::coverage artifact '$ARTIFACT_NAME' did not arrive (download conclusion: ${DOWNLOAD_CONCLUSION:-none})"
            exit 1
          }
          if [ -z "$ANALYZER" ]; then
            test -f "$COVERPROFILE" || {
              echo "::error::coverprofile '$COVERPROFILE' not found after downloading artifact '$ARTIFACT_NAME'; check the artifact's internal layout and the coverprofile input"
              exit 1
            }
          fi
