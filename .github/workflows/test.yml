# Test pipeline: unit + integration matrix (Go 1.24/1.25), e2e
# self-checks, and a dogfooded gaze AI report job that consumes the
# coverage artifact via the reusable workflow. The PR-safe gaze
# threshold check (JSON, no secrets) gates every PR; the AI report
# runs where the opencode-config secret resolves. Concurrency: PR
# runs cancel on supersede; main runs queue (CI-012).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-and-integration:
    name: Unit + Integration Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test release module validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-module-major.sh

      - name: Test release workflow-floor validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-workflow-floor.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -short -timeout 15m -coverprofile=coverage.out ./...

      - name: Gaze threshold check
        if: matrix.go-version == '1.24'
        run: |
          go build -o gaze ./cmd/gaze
          ./gaze report ./... \
            --format=json \
            --coverprofile=coverage.out \
            --max-crapload=38 \
            --max-gaze-crapload=6 \
            --min-contract-coverage=8 \
            > /dev/null

      - name: Upload coverage
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-out
          path: coverage.out

  e2e:
    name: E2E Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Self-Check Tests
        run: go test -race -count=1 -run 'TestRunSelfCheck' -timeout 30m ./cmd/gaze/...

  gaze-ai-report:
    name: Gaze AI Report
    needs: unit-and-integration
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_gaze_ai_report.yml
    with:
      coverage-artifact: coverage-out
      max-crapload: 38
      max-gaze-crapload: 6
      min-contract-coverage: 8
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
