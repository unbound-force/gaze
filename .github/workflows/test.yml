# Test pipeline: unit + integration matrix (Go 1.24/1.25), e2e
# self-checks, and a dogfooded gaze AI report job that consumes the
# coverage artifact via the reusable workflow and builds gaze from the
# commit under test (build-from-source). The PR-safe gaze
# threshold check (JSON, no secrets) gates every PR; the AI report
# runs where the opencode-config secret resolves. Concurrency: PR
# runs cancel on supersede; main runs queue (CI-012).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify change
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only --no-renames "${base}...${head}")"
          raw="$(git diff --raw --no-renames "${base}...${head}")"
          outside="$(printf '%s\n' "$files" \
            | grep -v '^\.uf/dewey/learnings/' || true)"
          dotdot="$(printf '%s\n' "$files" \
            | grep -E '(^|/)\.\.(/|$)' || true)"
          links="$(printf '%s\n' "$raw" \
            | awk '$1 ~ /120000/ || $2 ~ /120000/ { print $NF }')"
          if [ -z "$files" ] || [ -n "$outside" ] || [ -n "$dotdot" ] || [ -n "$links" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "files outside .uf/dewey/learnings/:"
            echo "$outside"
            echo "path traversal segments:"
            echo "$dotdot"
            echo "symlinks:"
            echo "$links"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "learnings-only pull request"
          fi

  unit-and-integration:
    name: Unit + Integration Tests (Go ${{ matrix.go-version }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test release module validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-module-major.sh

      - name: Test release workflow-floor validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-workflow-floor.sh

      - name: Test release AI-report default validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-ai-report-default.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -short -timeout 15m -coverprofile=coverage.out ./...

      - name: Gaze threshold check
        if: matrix.go-version == '1.24'
        run: |
          go build -o gaze ./cmd/gaze
          ./gaze report ./... \
            --format=json \
            --coverprofile=coverage.out \
            --max-crapload=38 \
            --max-gaze-crapload=6 \
            --min-contract-coverage=8 \
            > /dev/null

      - name: Upload coverage
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-out
          path: coverage.out

  e2e:
    name: E2E Tests (Go ${{ matrix.go-version }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Self-Check Tests
        run: go test -race -count=1 -run 'TestRunSelfCheck' -timeout 30m ./cmd/gaze/...

  # Skips transitively on learnings-only PRs: this job needs
  # unit-and-integration, which the changes job gates. Advisory and
  # deliberately outside ci-ok's needs: a provider outage or rejected
  # narrative cannot block a merge.
  gaze-ai-report:
    name: Gaze AI Report
    needs: unit-and-integration
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_gaze_ai_report.yml
    with:
      coverage-artifact: coverage-out
      # Dogfood the commit under test, not a pinned release.
      build-from-source: true
      max-crapload: 38
      max-gaze-crapload: 6
      min-contract-coverage: 8
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}

  ci-ok:
    name: CI OK
    needs: [changes, unit-and-integration, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS" \
            | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e \
            'to_entries | all(.value.result == "success"
                               or .value.result == "skipped")' \
            > /dev/null
