# Test pipeline: unit + integration matrix (Go 1.24/1.25), e2e
# self-checks, and a dogfooded gaze AI report job that consumes the
# coverage artifact via the reusable workflow and builds gaze from the
# commit under test (build-from-source). The PR-safe gaze
# threshold check (JSON, no secrets) gates every PR; the AI report
# runs where the opencode-config secret resolves. Concurrency: PR
# runs cancel on supersede; main runs queue (CI-012).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the heavy jobs must run: jflowers/ship's pr-scope.yml
  # outputs code == 'false' only for Dewey learnings PRs and gh-hud
  # toolkit rollouts, and 'true' for pushes and everything else.
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # main, after v0.11.0
    permissions:
      contents: read

  unit-and-integration:
    name: Unit + Integration Tests (Go ${{ matrix.go-version }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test release module validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-module-major.sh

      - name: Test release workflow-floor validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-workflow-floor.sh

      - name: Test release AI-report default validation
        if: matrix.go-version == '1.25'
        run: .github/scripts/test-validate-ai-report-default.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -short -timeout 15m -coverprofile=coverage.out ./...

      - name: Gaze threshold check
        if: matrix.go-version == '1.24'
        run: |
          go build -o gaze ./cmd/gaze
          ./gaze report ./... \
            --format=json \
            --coverprofile=coverage.out \
            --max-crapload=38 \
            --max-gaze-crapload=6 \
            --min-contract-coverage=8 \
            > /dev/null

      - name: Upload coverage
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-out
          path: coverage.out

  e2e:
    name: E2E Tests (Go ${{ matrix.go-version }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Self-Check Tests
        run: go test -race -count=1 -run 'TestRunSelfCheck' -timeout 30m ./cmd/gaze/...

  # Skips transitively on chore PRs: this job needs
  # unit-and-integration, which the scope job gates. Advisory and
  # deliberately outside ci-ok's needs: a provider outage or rejected
  # narrative cannot block a merge.
  gaze-ai-report:
    name: Gaze AI Report
    needs: unit-and-integration
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_gaze_ai_report.yml
    with:
      coverage-artifact: coverage-out
      # Dogfood the commit under test, not a pinned release.
      build-from-source: true
      max-crapload: 38
      max-gaze-crapload: 6
      min-contract-coverage: 8
    secrets:
      opencode-config: ${{ secrets.OPENCODE_CONFIG_CONTENT }}

  # Chore PRs (learnings, toolkit rollouts) skip MegaLinter, and with it
  # gitleaks: scan their commits for secrets here instead. Code PRs keep
  # MegaLinter's scan. The job name is kept so its check name is stable.
  gitleaks:
    name: Gitleaks (learnings-only)
    needs: scope
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # .gitleaksignore at the repo root is applied automatically.
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --verbose --no-banner

  # The required check. Passes only when scope succeeded and the jobs it
  # chose concluded as chosen: unit-and-integration and e2e for code PRs
  # and pushes, gitleaks for chore PRs. A skipped job counts as passing
  # and a skipped matrix job reports no per-leg checks, so this is the
  # only check branch protection should require. always(), not
  # !cancelled(): a cancelled run must report a red CI OK, never a skip.
  ci-ok:
    name: CI OK
    needs: [scope, unit-and-integration, e2e, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate CI result
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          UNIT: ${{ needs.unit-and-integration.result }}
          E2E: ${{ needs.e2e.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE code=$CODE unit-and-integration=$UNIT e2e=$E2E gitleaks=$GITLEAKS"
          [ "$SCOPE" = success ] || { echo "::error::scope: $SCOPE"; exit 1; }
          case "$CODE" in
            true) want_code=success want_chore=skipped ;;
            false) want_code=skipped want_chore=success ;;
            *) echo "::error::scope code '$CODE'"; exit 1 ;;
          esac
          fail=0
          for pair in "unit-and-integration=$UNIT:$want_code" "e2e=$E2E:$want_code" "gitleaks=$GITLEAKS:$want_chore"; do
            job=${pair%%=*} rest=${pair#*=}
            got=${rest%%:*} want=${rest#*:}
            if [ "$got" != "$want" ]; then
              echo "::error::$job: $got, want $want"
              fail=1
            fi
          done
          exit "$fail"
