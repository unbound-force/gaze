# Release
# =======
# One-click release via workflow_dispatch. The pipeline itself lives in
# jflowers/ship's go-release.yml, shared with the other unbound-force Go
# tools.
#
# Three local gates run first, all offline and unskippable: the
# module-major check (tag major vs. the go.mod module path), the
# workflow-floor check (tag vs. the minWorkflowTag floor that `gaze init
# --ci` enforces; above-floor releases require the floor tag to exist and
# contain the reusable AI-report workflow), and the AI-report default
# check (the reusable workflow's gaze-version default must equal the tag,
# since callers pinned to the tag inherit that default).
#
# Then ship runs:
#   settings    signing needs all of the MACOS_* secrets or none; a partial
#               set fails before anything is tagged (none = unsigned)
#   preflight   org-infra: semver, tag uniqueness (with re-run resilience),
#               semver ordering, CI on HEAD, unreleased commits; creates
#               the annotated tag
#   release     org-infra: GoReleaser with cosign signatures and SBOMs
#   sign-macos  Developer ID signing + notarization of the darwin archives,
#               re-uploaded with checksums.txt rewritten to match
#   cask        every sha256 set from the final checksums.txt, checked with
#               brew audit, pushed to unbound-force/homebrew-tap
#   verify-go-install
#               go install github.com/unbound-force/gaze/v2/cmd/gaze@<tag>
#               from proxy.golang.org with an empty module cache (retried
#               for proxy lag); the build info must name that package at
#               the tag, then gaze --version runs
#
# Fixes: https://github.com/unbound-force/unbound-force/issues/428

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.15.0)'
        required: true
        type: string
      skip_semver_check:
        description: 'Skip semver ordering verification'
        type: boolean
        default: false
      skip_ci_checks:
        description: 'Skip CI check verification on HEAD'
        type: boolean
        default: false
      skip_unreleased_check:
        description: 'Skip unreleased commits verification'
        type: boolean
        default: false

permissions: {}

jobs:
  validate-module-major:
    name: Validate Module Major
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate module path against release tag
        run: .github/scripts/validate-module-major.sh -- "$RELEASE_TAG" go.mod

  validate-workflow-floor:
    name: Validate Workflow Floor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Full history so existing tags are available locally; the floor
          # check verifies them offline instead of querying the GitHub API.
          fetch-depth: 0

      - name: Validate release tag against workflow floor
        run: .github/scripts/validate-workflow-floor.sh -- "$RELEASE_TAG" .

  validate-ai-report-default:
    name: Validate AI Report Default
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate reusable AI-report gaze-version default against release tag
        run: .github/scripts/validate-ai-report-default.sh -- "$RELEASE_TAG"

  release:
    name: Release
    needs: [validate-module-major, validate-workflow-floor, validate-ai-report-default]
    uses: jflowers/ship/.github/workflows/go-release.yml@01e205c8897d54daac4d30b81710c695bfd1f31b # v0.10.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["Unit + Integration Tests (Go 1.24)", "Unit + Integration Tests (Go 1.25)", "MegaLinter"]'
      # Ship's default too; explicit so rc tags (vX.Y.Z-rc.N) keep working
      # if that default ever changes.
      allow_prerelease: true
      skip_semver_check: ${{ inputs.skip_semver_check }}
      skip_ci_checks: ${{ inputs.skip_ci_checks }}
      skip_unreleased_check: ${{ inputs.skip_unreleased_check }}
      tap: unbound-force/homebrew-tap
      # What go install and mise's go: backend users get, checked after
      # every release.
      go_install: github.com/unbound-force/gaze/v2/cmd/gaze
      go_install_check: '"$BIN" --version'
    permissions:
      contents: write
      checks: read
      id-token: write
    # Mapped by name: inherited secrets don't reach a workflow in
    # another owner's repo. This repo's tap token is named
    # HOMEBREW_TAP_GITHUB_TOKEN; ship calls it HOMEBREW_TAP_TOKEN.
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
