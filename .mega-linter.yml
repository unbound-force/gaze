# MegaLinter configuration
# https://megalinter.io/configuration/
# Using the Go flavor: oxsecurity/megalinter-go

# Only run these specific linters (whitelist approach)
ENABLE_LINTERS:
  - GO_GOLANGCI_LINT
  - MARKDOWN_MARKDOWNLINT
  - YAML_YAMLLINT
  - REPOSITORY_GITLEAKS
  - REPOSITORY_GIT_DIFF

# Exclude spec templates, opencode config, and testdata from linting
FILTER_REGEX_EXCLUDE: '(\.specify/templates/|\.opencode/|testdata/)'

# Exclude spec markdown files from markdownlint (they use non-standard
# formatting). Embedded asset mirrors are byte-identical copies of
# .opencode/ sources (TestEmbeddedAssetsMatchSource) and must never be
# reformatted independently. Dewey learnings (.uf/) regenerate on every
# retrospective and openspec/changes/ artifacts embed workflow template
# text — both are machine-generated, so hand-fixing is not durable.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: '(\.specify/|\.opencode/|specs/|\.uf/|openspec/changes/|internal/scaffold/assets/|internal/aireport/assets/)'

SHOW_ELAPSED_TIME: true
